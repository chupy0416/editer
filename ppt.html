<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ppt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap">
<style>
:root{--bg:#eceef2;--panel:#fff;--ink:#1d2330;--mute:#6b7385;--line:#d6dae2;--acc:#3b4cca;--acc-ink:#fff;--stage:#dfe2e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--panel:#1d212c;--ink:#e8eaf0;--mute:#8d95a8;--line:#323848;--acc:#7a8bff;--acc-ink:#10131c;--stage:#0f1218}}
:root[data-theme="dark"]{--bg:#14171f;--panel:#1d212c;--ink:#e8eaf0;--mute:#8d95a8;--line:#323848;--acc:#7a8bff;--acc-ink:#10131c;--stage:#0f1218}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 "Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp{display:flex;gap:5px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
.grp:last-child{border:0}
button,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
label.f{display:flex;gap:4px;align-items:center;color:var(--mute);font-size:12px}
input[type=number]{width:54px;font:inherit;padding:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{width:70px}
main{flex:1;display:flex;min-height:0}
#side{width:196px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#sbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-bottom:1px solid var(--line)}
#list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.item small{color:var(--mute);width:16px;text-align:right;padding-top:2px}
.thumb{position:relative;width:150px;height:84px;border:2px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.item.on .thumb{border-color:var(--acc)}
#area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--stage)}
#stwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px}
#stagebox{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.3);flex:none}
#notes{height:64px;resize:none;border:0;border-top:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;padding:8px 12px}
.slide{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden}
.el{position:absolute;touch-action:none;line-height:1.25;user-select:none}
.el [contenteditable=true]{user-select:text;outline:none;cursor:text}
.tx{position:absolute;inset:0;padding:8px;display:flex;flex-direction:column;white-space:pre-wrap;overflow:hidden;word-break:break-word}
.el img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.el table{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
.el td{border:1px solid #8886;padding:6px;vertical-align:middle;word-break:break-word}
.edit .el{cursor:move}
.el.sel{outline:2px solid var(--acc)}
.hd{position:absolute;width:11px;height:11px;background:#fff;border:2px solid var(--acc);border-radius:3px}
.hd.nw{left:-6px;top:-6px;cursor:nwse-resize}.hd.n{left:calc(50% - 6px);top:-6px;cursor:ns-resize}.hd.ne{right:-6px;top:-6px;cursor:nesw-resize}
.hd.e{right:-6px;top:calc(50% - 6px);cursor:ew-resize}.hd.se{right:-6px;bottom:-6px;cursor:nwse-resize}.hd.s{left:calc(50% - 6px);bottom:-6px;cursor:ns-resize}
.hd.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.hd.w{left:-6px;top:calc(50% - 6px);cursor:ew-resize}
.hd.rot{left:calc(50% - 6px);top:-26px;border-radius:50%;cursor:grab}
#pres{position:fixed;inset:0;background:#000;z-index:9;display:none;cursor:none}
#pres.on{display:block}
#pcount{position:fixed;right:14px;bottom:10px;color:#fff8;font-size:12px;z-index:10}
.stw{overflow:hidden}
.tr-fade{animation:fd .5s}.tr-slide{animation:sl .45s}.tr-zoom{animation:zm .45s}
@keyframes fd{from{opacity:0}}@keyframes sl{from{opacity:0;transform:translateX(60px)}}@keyframes zm{from{opacity:0;transform:scale(.9)}}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(520px,92vw)}
dialog textarea{width:100%;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;margin:8px 0}
@media (prefers-reduced-motion:reduce){.stw{animation:none!important}}
@media (max-width:760px){main{flex-direction:column}#side{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}#sbar{flex-direction:column;border:0}#list{flex-direction:row;overflow-x:auto;overflow-y:hidden}.item small{display:none}.thumb{width:110px;height:62px}}

header{padding:0;gap:0;max-height:none;overflow:visible;flex-direction:column}
#tbar{display:flex;align-items:center;gap:12px;background:#c43e1c;color:#fff;padding:4px 10px}
#tbar button{background:#ffffff22;color:#fff;border-color:#ffffff55;padding:2px 9px}
#qat{display:flex;gap:4px}#ttl{flex:1;text-align:center;font-weight:700}#sv{font-size:11px;opacity:.9}
#tabs{display:flex;background:#c43e1c;padding:0 8px;gap:2px;overflow-x:auto}
.tab{background:transparent;color:#fff;border:0;border-radius:6px 6px 0 0;padding:6px 14px;white-space:nowrap}
.tab:hover{background:#ffffff22}.tab.on{background:var(--panel);color:#c43e1c;font-weight:700}.tab.f{background:#8e2f17}
#rib{background:var(--panel);border-bottom:1px solid var(--line)}
.rb{display:flex;padding:6px 8px;overflow-x:auto}.rb[hidden]{display:none}
.g{display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:0 10px;border-right:1px solid var(--line);flex:none}
.gi{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-height:30px;max-width:420px}
.gl{text-align:center;color:var(--mute);font-size:11px}
#status{display:flex;align-items:center;gap:8px;padding:3px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
#status .sp{flex:1}#zr{width:130px}#status button{padding:1px 8px}
#stwrap{overflow:auto;align-items:flex-start;justify-content:flex-start}#stagebox{margin:auto}
@media (max-width:760px){main{flex-direction:column}}
#cdlg{width:min(680px,94vw)}#cdlg .crow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.cg{border-collapse:collapse}.cg th,.cg td{padding:2px}.cg input{width:92px;font:inherit;padding:3px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}.cg input[type=color]{width:28px;height:24px;padding:0}
</style>

</head>

<div id="rib">
 <div class="rb" id="p0" hidden>
  <div class="g"><div class="gi"><button id="bNew">새 프레젠테이션</button><button id="bImp">열기 (.pptx / .json)</button><button id="bPptx">PPTX로 저장</button><button id="bPdf">PDF로 저장</button><button id="bExp">JSON으로 저장</button><button id="bKeys">단축키 보기</button><input type="file" id="fOpen" accept=".pptx,.json" hidden></div><div class="gl">파일</div></div>
 </div>
 <div class="rb" id="p1">
  <div class="g"><div class="gi"><button id="bPaste">붙여넣기</button><button id="bCut">잘라내기</button><button id="bCopy">복사</button></div><div class="gl">클립보드</div></div>
  <div class="g"><div class="gi"><select id="lay"><option value="blank">빈 화면</option><option value="title">제목</option><option value="content">제목+내용</option><option value="two">2단</option></select><button id="sAdd" title="Ctrl+M">새 슬라이드</button><button id="sDup">복제</button><button id="sDel">삭제</button></div><div class="gl">슬라이드</div></div>
  <div class="g"><div class="gi"><select id="pFont"><option>Noto Sans KR</option><option>Noto Serif KR</option><option>Georgia</option><option>Arial</option><option>Courier New</option></select><input type="number" id="pSize" min="8" max="300" value="28" title="글자 크기"><button id="bB" title="Ctrl+B"><b>B</b></button><button id="bI" title="Ctrl+I"><i>I</i></button><button id="bU" title="Ctrl+U"><u>U</u></button><label class="f">글자색<input type="color" id="pColor" value="#1d2330"></label></div><div class="gl">글꼴</div></div>
  <div class="g"><div class="gi"><button id="aL" title="Ctrl+L">왼쪽</button><button id="aC" title="Ctrl+E">가운데</button><button id="aR" title="Ctrl+R">오른쪽</button></div><div class="gl">단락</div></div>
  <div class="g"><div class="gi"><label class="f">채움<input type="color" id="pFill" value="#3b4cca"></label><label class="f">윤곽<input type="color" id="pStroke" value="#000000"></label><input type="number" id="pSw" min="0" max="30" value="0" title="윤곽 두께"><label class="f"><input type="checkbox" id="pSh">그림자</label></div><div class="gl">그리기</div></div>
  <div class="g"><div class="gi"><select id="pAl"><option value="">맞춤</option><option value="l">왼쪽 맞춤</option><option value="c">가운데 맞춤</option><option value="r">오른쪽 맞춤</option><option value="t">위쪽 맞춤</option><option value="m">중간 맞춤</option><option value="b">아래쪽 맞춤</option></select><button id="bFront">맨 앞으로</button><button id="bBack">맨 뒤로</button><label class="f">회전<input type="number" id="pRot" value="0"></label><label class="f">투명도<input type="range" id="pOp" min="10" max="100" value="100"></label></div><div class="gl">정렬</div></div>
  <div class="g"><div class="gi"><button id="bDup" title="Ctrl+D">복제</button><button id="bDel" title="Delete">삭제</button><button id="bRow">표 행+</button><button id="bCol">표 열+</button><button id="bRowD">표 행−</button><button id="bColD">표 열−</button><button id="bData">차트 편집</button></div><div class="gl">편집</div></div>
 </div>
 <div class="rb" id="p2" hidden>
  <div class="g"><div class="gi"><button id="bText">텍스트 상자</button><select id="sh"><option value="">도형</option><option value="rect">사각형</option><option value="round">둥근 사각형</option><option value="ellipse">원</option><option value="tri">삼각형</option><option value="dia">마름모</option><option value="star">별</option><option value="arrow">화살표</option><option value="line">선</option></select></div><div class="gl">도형</div></div>
  <div class="g"><div class="gi"><button id="bTbl">표</button><button id="bImg">이미지</button><input type="file" id="file" accept="image/*" hidden><select id="chs"><option value="">차트</option><option value="bar">막대</option><option value="line">꺾은선</option><option value="pie">원형</option></select></div><div class="gl">표 · 이미지 · 차트</div></div>
  <div class="g"><div class="gi"><label class="f"><input type="checkbox" id="pNum">슬라이드 번호</label></div><div class="gl">텍스트</div></div>
 </div>
 <div class="rb" id="p3" hidden>
  <div class="g"><div class="gi"><select id="pTheme"></select></div><div class="gl">테마</div></div>
  <div class="g"><div class="gi"><label class="f">배경<input type="color" id="pBg" value="#ffffff"><input type="color" id="pBg2" value="#dddddd"></label><button id="bBg1">단색</button></div><div class="gl">배경 서식</div></div>
 </div>
 <div class="rb" id="p4" hidden>
  <div class="g"><div class="gi"><select id="pTr"><option value="none">없음</option><option value="fade">페이드</option><option value="slide">밀기</option><option value="zoom">확대</option></select><button id="bTrAll">모두 적용</button></div><div class="gl">슬라이드 전환</div></div>
 </div>
 <div class="rb" id="p5" hidden>
  <div class="g"><div class="gi"><button class="pri" id="bPlayAll" title="F5">처음부터</button><button id="bPlay" title="Shift+F5">현재 슬라이드부터</button></div><div class="gl">슬라이드 쇼 시작</div></div>
 </div>
 <div class="rb" id="p6" hidden>
  <div class="g"><div class="gi"><label class="f"><input type="checkbox" id="vNotes" checked>노트</label><button id="b100">100%</button></div><div class="gl">표시</div></div>
 </div>
</div>
</header>
<main>
 <aside id="side"><div id="list"></div></aside>
 <section id="area"><div id="stwrap"><div id="stagebox"></div></div><textarea id="notes" placeholder="발표자 노트를 입력하세요"></textarea></section>
</main>
<footer id="status"><span id="stat"></span><span class="sp"></span><button id="bZm">−</button><input type="range" id="zr" min="20" max="300" value="100"><button id="bZp">+</button><span id="zl">100%</span><button id="bFit">슬라이드 맞춤</button></footer>
<div id="pres"></div><div id="pcount" hidden></div>
<dialog id="cdlg"><div class="crow"><label>종류 <select id="cType"><option value="bar">막대</option><option value="line">꺾은선</option><option value="pie">원형</option></select></label><label>제목 <input id="cTitle"></label><label><input type="checkbox" id="cVal">값 표시</label><label><input type="checkbox" id="cLeg">범례</label></div><div id="cGrid" style="overflow:auto;max-height:50vh"></div><div class="crow"><button id="cAddR">행 추가</button><button id="cDelR">행 삭제</button><button id="cAddC">계열 추가</button><button id="cDelC">계열 삭제</button></div><div><button class="pri" id="cOk">적용</button> <button id="cNo">취소</button></div></dialog>
<dialog id="dlg"><div id="dT"></div><textarea id="dA" rows="10"></textarea><div><button class="pri" id="dOk">확인</button> <button id="dNo">취소</button></div></dialog>

<script>
const W=960,H=540,$=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TM={'라이트':{bg:'#ffffff',t:'#1d2330',b:'#4a5266',a:'#3b4cca',f:'Noto Sans KR'},'다크':{bg:'#1b1f2a',t:'#f4f5f8',b:'#b8bfd0',a:'#7a8bff',f:'Noto Sans KR'},'오션':{bg:'#eaf4f8',t:'#0b3b53',b:'#2f5d73',a:'#13a4c6',f:'Noto Sans KR'},'숲':{bg:'#f1f4ea',t:'#233a22',b:'#4d6247',a:'#5b8c3a',f:'Noto Serif KR'},'노을':{bg:'#fff3ea',t:'#4a1f1a',b:'#7a4a3f',a:'#e0603f',f:'Noto Serif KR'}};
const PAL=a=>[a,'#e0603f','#f2b134','#2fa38a','#8a5bd6','#d6457a'];
const P={rect:'<rect width="100" height="100"/>',round:'<rect width="100" height="100" rx="12"/>',ellipse:'<ellipse cx="50" cy="50" rx="50" ry="50"/>',tri:'<polygon points="50,0 100,100 0,100"/>',dia:'<polygon points="50,0 100,50 50,100 0,50"/>',star:'<polygon points="50,0 61,35 98,35 68,57 79,91 50,70 21,91 32,57 2,35 39,35"/>',arrow:'<polygon points="0,28 60,28 60,0 100,50 60,100 60,72 0,72"/>',line:'<line x1="0" y1="50" x2="100" y2="50"/>'};
let S;try{S=JSON.parse(localStorage.getItem('slides-v2'))}catch(e){}
function TH(){return TM[S.theme]||TM['라이트']}
function tx(x,y,w,h,text,size,color,bold){return {id:uid(),type:'s',shape:'none',x,y,w,h,rot:0,op:1,text,size,color,bold,al:'left',va:'top',font:TH().f}}
function mkSlide(k){const t=TH(),e=[];
 if(k==='title')e.push(tx(80,170,800,110,'발표 제목',60,t.t,1),tx(80,300,800,60,'부제목을 입력하세요',28,t.b));
 else if(k==='content')e.push(tx(60,40,840,80,'제목',44,t.t,1),tx(60,140,840,340,'• 첫 번째 내용\n• 두 번째 내용\n• 세 번째 내용',28,t.b));
 else if(k==='two')e.push(tx(60,40,840,80,'제목',44,t.t,1),tx(60,140,400,340,'• 왼쪽 내용',26,t.b),tx(500,140,400,340,'• 오른쪽 내용',26,t.b));
 return {bg:t.bg,els:e,notes:'',tr:'none'}}
if(!S||!S.slides||!S.slides.length){S={theme:'라이트',num:false,cur:0,slides:[]};S.slides.push(mkSlide('title'))}
S.sel=[];S.cur=Math.min(S.cur||0,S.slides.length-1);
let zoom=0,lf=false,scale=1,hist=[JSON.stringify(S.slides)],hi=0,clip=null;
const cur=()=>S.slides[S.cur],sels=()=>cur().els.filter(e=>S.sel.includes(e.id));
function commit(){const j=JSON.stringify(S.slides);try{localStorage.setItem('slides-v2',JSON.stringify({theme:S.theme,num:S.num,cur:S.cur,slides:S.slides}))}catch(e){}
 if(j===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>80)hist.shift();hi=hist.length-1}
function undo(d){const n=hi+d;if(n<0||n>=hist.length)return;hi=n;S.slides=JSON.parse(hist[hi]);S.cur=Math.min(S.cur,S.slides.length-1);S.sel=[];render()}

function svgOf(el){if(el.shape==='none')return'';const ln=el.shape==='line';
 return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" fill="'+(ln?'none':el.fill)+'" stroke="'+(el.stroke||(ln?el.fill:'none'))+'" stroke-width="'+(el.sw||(ln?3:0))+'">'+P[el.shape].replace(/<(\w+) /,'<$1 vector-effect="non-scaling-stroke" ')+'</svg>'}
function chartSvg(el){const d=el.data,mx=Math.max(...d.map(x=>x.v),1),C=PAL(el.fill),c=el.color||'#333';
 let s='<svg viewBox="0 0 400 300" style="width:100%;height:100%" font-size="14" fill="'+c+'" text-anchor="middle">';
